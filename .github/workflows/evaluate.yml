name: "Evaluate mainnet scripts"

on:
  schedule:
    - cron: "0 0 * * 6" # Run every Saturday at midnight

  workflow_dispatch:
    inputs:
      plutusBranch:
        description: "Plutus branch to evaluate"
        required: false
        default: "master"
      startFrom:
        description: Start evaluation from a record with specified primary key
        required: false
        default: "0"

jobs:
  build:
    name: Build
    runs-on: [plutus-node, self-hosted]
    timeout-minutes: 1440
    steps:
      - name: Checkout this Repo
        uses: actions/checkout@v5.1.0

      - name: Add plutus SRP to the cabal.project
        id: update_cabal_project
        working-directory: run-script-evaluations
        # Pass the branch through env and read it as a shell variable so the value
        # stays data and is never parsed as part of the command (avoids injection).
        env:
          PLUTUS_BRANCH: ${{ github.event.inputs.plutusBranch || 'master' }}
        run: |
          # shellcheck disable=SC2016 # $PLUTUS_BRANCH is expanded by the nix-shell sub-shell, intentionally not by this shell
          NIX_PATH="nixpkgs=channel:nixos-unstable" \
            nix-shell -p nix-prefetch-git --run \
            './add_srp.sh --branch "$PLUTUS_BRANCH"'

      - name: Update flake inputs to cover the synced index-state
        working-directory: run-script-evaluations
        # add_srp.sh syncs the cabal.project index-state to the pinned Plutus commit.
        # haskell.nix builds the plan from the pinned hackage.nix / CHaP flake inputs,
        # so their snapshots must also be recent enough to know those index-states.
        run: nix flake update hackage CHaP --accept-flake-config

      - name: Evaluate
        working-directory: run-script-evaluations
        # START_FROM is passed through env and read as a shell variable for the same reason.
        env:
          PGPASSWORD: ${{ secrets.PLUTUS_READER_PGPASS }}
          START_FROM: ${{ github.event.inputs.startFrom || '0' }}
        run: |
          # shellcheck disable=SC2016 # $START_FROM is expanded by the bash -c sub-shell, intentionally not by this shell
          nix develop --no-warn-dirty --accept-flake-config --impure \
            --command bash -c 'cabal clean && \
              cabal update && \
              cabal run exe:run-script-evaluations -- \
              --start-from="$START_FROM" \
              --database-conn-str "host=localhost port=5432 dbname=mainnet_plutus_events user=plutus-reader" \
              2>&1 | tee evaluation.log'

